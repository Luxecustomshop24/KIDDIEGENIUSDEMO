<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>KiddieGenius 🌟 Learn &amp; Play!</title>
  <style>
    /* ===== GLOBAL ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pink:   #FF6B9D;
      --purple: #9B59B6;
      --blue:   #3498DB;
      --green:  #2ECC71;
      --yellow: #F1C40F;
      --orange: #E67E22;
      --red:    #E74C3C;
      --teal:   #1ABC9C;
      --bg:     #FFF9F0;
      --text:   #333;
      --radius: 20px;
      --shadow: 0 6px 20px rgba(0,0,0,.15);
    }
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Trebuchet MS', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      background: linear-gradient(135deg, #FF6B9D, #9B59B6, #3498DB);
      padding: 18px 20px 14px;
      text-align: center;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: clamp(1.6rem,5vw,2.6rem); color:#fff; text-shadow:3px 3px 0 rgba(0,0,0,.2); letter-spacing:2px; }
    header p  { color:rgba(255,255,255,.9); font-size:clamp(.85rem,2.5vw,1.1rem); margin-top:4px; }
    nav {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 10px; padding: 18px 14px;
      background: #fff; border-bottom: 3px solid #eee;
    }
    .tab-btn {
      cursor: pointer; border: 3px solid transparent; border-radius: 50px;
      padding: 10px 18px; font-family: inherit; font-size: clamp(.85rem,2.2vw,1.1rem);
      font-weight: bold; color: #fff;
      transition: transform .15s, box-shadow .15s; outline: none; user-select: none;
    }
    .tab-btn:hover,.tab-btn:focus { transform:scale(1.08); box-shadow:var(--shadow); }
    .tab-btn.active { border-color:#333; transform:scale(1.1); box-shadow:0 0 0 4px rgba(0,0,0,.12); }
    .tab-btn[data-tab="abc"]    { background:var(--pink); }
    .tab-btn[data-tab="count"]  { background:var(--blue); }
    .tab-btn[data-tab="math"]   { background:var(--green); }
    .tab-btn[data-tab="shapes"] { background:var(--orange); }
    .tab-btn[data-tab="words"]  { background:var(--purple); }
    main { padding: 24px 16px 40px; max-width: 900px; margin: 0 auto; }
    .section { display: none; animation: fadeIn .35s ease; }
    .section.active { display: block; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .section-title { text-align:center; font-size:clamp(1.4rem,4vw,2rem); margin-bottom:22px; text-shadow:2px 2px 0 rgba(0,0,0,.08); }
    #star-bar { text-align:center; font-size:clamp(1.1rem,3vw,1.5rem); margin-bottom:20px; letter-spacing:3px; }
    #star-display { color:var(--yellow); }

    /* ABC */
    .abc-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(68px,1fr)); gap:10px; }
    .letter-card {
      background:linear-gradient(135deg,#FF6B9D,#FF8E53); color:#fff;
      border-radius:var(--radius); padding:14px 6px; text-align:center;
      cursor:pointer; font-size:1.9rem; font-weight:bold; box-shadow:var(--shadow);
      transition:transform .15s; border:none; outline:none; font-family:inherit; user-select:none;
    }
    .letter-card:hover,.letter-card:focus { transform:scale(1.12); }
    .letter-card span { display:block; font-size:.75rem; margin-top:4px; }
    #abc-display { margin-top:26px; text-align:center; background:#fff; border-radius:var(--radius); padding:24px; box-shadow:var(--shadow); min-height:120px; }
    #abc-display .big-letter { font-size:clamp(4rem,14vw,8rem); color:var(--pink); font-weight:bold; }
    #abc-display .letter-word { font-size:clamp(1.2rem,4vw,2rem); color:var(--purple); margin-top:6px; }
    #abc-display .letter-emoji { font-size:clamp(2rem,7vw,4rem); margin-top:6px; }

    /* COUNT */
    .count-controls { display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:24px; flex-wrap:wrap; }
    .big-number { font-size:clamp(4rem,14vw,8rem); font-weight:bold; color:var(--blue); min-width:120px; text-align:center; }
    .round-btn { width:64px; height:64px; border-radius:50%; border:none; font-size:2rem; font-weight:bold; cursor:pointer; color:#fff; box-shadow:var(--shadow); transition:transform .15s; outline:none; font-family:inherit; }
    .round-btn:hover,.round-btn:focus { transform:scale(1.15); }
    .round-btn.minus { background:var(--red); }
    .round-btn.plus  { background:var(--green); }
    #dot-area { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; padding:10px; }
    .dot { width:48px; height:48px; border-radius:50%; box-shadow:0 3px 8px rgba(0,0,0,.2); animation:popIn .25s cubic-bezier(.175,.885,.32,1.275) both; }
    @keyframes popIn { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }

    /* MATH */
    .math-card { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:28px 20px; text-align:center; max-width:480px; margin:0 auto 24px; }
    .math-problem { font-size:clamp(2rem,8vw,4rem); font-weight:bold; color:var(--green); margin-bottom:18px; }
    .math-choices { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; }
    .choice-btn { width:80px; height:80px; border-radius:18px; border:4px solid transparent; font-family:inherit; font-size:2rem; font-weight:bold; cursor:pointer; background:var(--blue); color:#fff; box-shadow:var(--shadow); transition:transform .15s; outline:none; }
    .choice-btn:hover,.choice-btn:focus { transform:scale(1.12); }
    .choice-btn.correct { background:var(--green); animation:bounce .5s; }
    .choice-btn.wrong   { background:var(--red);   animation:shake  .4s; }
    @keyframes bounce { 0%,100%{transform:scale(1)} 30%{transform:scale(1.3)} 60%{transform:scale(.9)} }
    @keyframes shake  { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 60%{transform:translateX(8px)} }
    #math-feedback { font-size:1.4rem; min-height:40px; margin-top:12px; font-weight:bold; }
    .math-emoji-row { font-size:clamp(1.2rem,4vw,2rem); margin-bottom:10px; letter-spacing:4px; }
    #math-next-btn, #words-next-btn {
      margin-top:16px; padding:12px 32px; border-radius:50px; border:none;
      font-family:inherit; font-size:1.1rem; font-weight:bold; cursor:pointer;
      color:#fff; box-shadow:var(--shadow); display:none; transition:transform .15s; outline:none;
    }
    #math-next-btn { background:var(--purple); }
    #words-next-btn { background:var(--teal); }
    #math-next-btn:hover, #words-next-btn:hover { transform:scale(1.08); }

    /* SHAPES */
    .shapes-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:16px; }
    .shape-card { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 10px; text-align:center; cursor:pointer; transition:transform .15s; outline:none; }
    .shape-card:hover,.shape-card:focus { transform:scale(1.08); }
    .shape-svg { width:80px; height:80px; margin:0 auto 10px; display:block; }
    .shape-name { font-size:1.1rem; font-weight:bold; }
    .shape-sides { font-size:.85rem; color:#666; margin-top:4px; }
    #shape-feedback { text-align:center; font-size:clamp(1.2rem,3.5vw,1.6rem); font-weight:bold; min-height:40px; margin-top:10px; color:var(--orange); }

    /* WORDS */
    .word-card { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:28px 20px; text-align:center; max-width:480px; margin:0 auto 24px; }
    .sight-word { font-size:clamp(3rem,12vw,6rem); font-weight:bold; color:var(--purple); letter-spacing:8px; }
    .word-hint { font-size:1.1rem; color:#888; margin-top:8px; }
    .word-choices { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:20px; }
    .word-choice { padding:14px 22px; border-radius:14px; border:3px solid transparent; font-family:inherit; font-size:1.3rem; font-weight:bold; cursor:pointer; background:var(--purple); color:#fff; box-shadow:var(--shadow); transition:transform .15s; outline:none; }
    .word-choice:hover,.word-choice:focus { transform:scale(1.1); }
    .word-choice.correct { background:var(--green); animation:bounce .5s; }
    .word-choice.wrong   { background:var(--red);   animation:shake  .4s; }
    #words-feedback { font-size:1.4rem; min-height:40px; margin-top:12px; font-weight:bold; text-align:center; }

    /* CONFETTI */
    #confetti-canvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; }
  </style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>

<header>
  <h1>🌟 KiddieGenius 🌟</h1>
  <p>Learn, Play, and Grow! 🎈</p>
</header>

<nav>
  <button class="tab-btn active" data-tab="abc">🔤 ABC's</button>
  <button class="tab-btn" data-tab="count">🔢 Counting</button>
  <button class="tab-btn" data-tab="math">➕ Math</button>
  <button class="tab-btn" data-tab="shapes">🔷 Shapes</button>
  <button class="tab-btn" data-tab="words">📖 Words</button>
</nav>

<main>
  <div id="star-bar">⭐ Stars earned: <span id="star-display">0</span></div>

  <!-- ABC -->
  <section id="sec-abc" class="section active">
    <h2 class="section-title" style="color:var(--pink)">🔤 Learn the Alphabet!</h2>
    <div class="abc-grid" id="abc-grid"></div>
    <div id="abc-display">
      <div style="color:#aaa;font-size:1.2rem;padding-top:20px">👆 Tap a letter to learn it!</div>
    </div>
  </section>

  <!-- COUNT -->
  <section id="sec-count" class="section">
    <h2 class="section-title" style="color:var(--blue)">🔢 Counting Fun!</h2>
    <div class="count-controls">
      <button class="round-btn minus" id="minus-btn" aria-label="minus one">−</button>
      <div class="big-number" id="count-num">5</div>
      <button class="round-btn plus" id="plus-btn" aria-label="plus one">+</button>
    </div>
    <div id="dot-area"></div>
    <p style="text-align:center;color:#888;margin-top:14px;font-size:1rem">Use + and − to change the number. Count the dots!</p>
  </section>

  <!-- MATH -->
  <section id="sec-math" class="section">
    <h2 class="section-title" style="color:var(--green)">➕ Math Magic!</h2>
    <div class="math-card">
      <div class="math-emoji-row" id="math-emoji-row"></div>
      <div class="math-problem" id="math-problem"></div>
      <div class="math-choices" id="math-choices"></div>
      <div id="math-feedback"></div>
      <button id="math-next-btn">Next Question ➡️</button>
    </div>
  </section>

  <!-- SHAPES -->
  <section id="sec-shapes" class="section">
    <h2 class="section-title" style="color:var(--orange)">🔷 Colors &amp; Shapes!</h2>
    <div class="shapes-grid" id="shapes-grid"></div>
    <div id="shape-feedback"></div>
  </section>

  <!-- WORDS -->
  <section id="sec-words" class="section">
    <h2 class="section-title" style="color:var(--purple)">📖 Sight Words!</h2>
    <div class="word-card">
      <div class="sight-word" id="sight-word"></div>
      <div class="word-hint" id="word-hint"></div>
      <div class="word-choices" id="word-choices"></div>
      <div id="words-feedback"></div>
      <button id="words-next-btn">Next Word ➡️</button>
    </div>
  </section>
</main>

<script>
/* ===== UTILITIES ===== */
var stars = 0;
function addStar(n) {
  n = n || 1;
  stars += n;
  document.getElementById('star-display').textContent = stars;
  if (stars % 5 === 0) launchConfetti();
}
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.rate = 0.88; u.pitch = 1.2;
  window.speechSynthesis.speak(u);
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ===== TABS ===== */
document.querySelectorAll('.tab-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('.section').forEach(function(s){ s.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('sec-' + btn.dataset.tab).classList.add('active');
    speak(btn.textContent.replace(/[^\w\s]/g, '').trim());
  });
});

/* ===== ABC ===== */
var LETTERS = [
  {l:'A',word:'Apple',   emoji:'🍎'},{l:'B',word:'Ball',    emoji:'⚽'},
  {l:'C',word:'Cat',     emoji:'🐱'},{l:'D',word:'Dog',     emoji:'🐶'},
  {l:'E',word:'Egg',     emoji:'🥚'},{l:'F',word:'Fish',    emoji:'🐟'},
  {l:'G',word:'Grapes',  emoji:'🍇'},{l:'H',word:'Hat',     emoji:'🎩'},
  {l:'I',word:'Ice Cream',emoji:'🍦'},{l:'J',word:'Juice',  emoji:'🧃'},
  {l:'K',word:'Kite',    emoji:'🪁'},{l:'L',word:'Lion',    emoji:'🦁'},
  {l:'M',word:'Moon',    emoji:'🌙'},{l:'N',word:'Nest',    emoji:'🪺'},
  {l:'O',word:'Orange',  emoji:'🍊'},{l:'P',word:'Pizza',   emoji:'🍕'},
  {l:'Q',word:'Queen',   emoji:'👑'},{l:'R',word:'Rainbow', emoji:'🌈'},
  {l:'S',word:'Sun',     emoji:'☀️'},{l:'T',word:'Train',   emoji:'🚂'},
  {l:'U',word:'Umbrella',emoji:'☂️'},{l:'V',word:'Volcano', emoji:'🌋'},
  {l:'W',word:'Whale',   emoji:'🐳'},{l:'X',word:'X-ray',   emoji:'🩻'},
  {l:'Y',word:'Yo-yo',   emoji:'🪀'},{l:'Z',word:'Zebra',   emoji:'🦓'},
];
var ABC_COLORS = ['#FF6B9D','#FF8E53','#F1C40F','#2ECC71','#3498DB','#9B59B6','#1ABC9C','#E67E22'];
var abcGrid = document.getElementById('abc-grid');
var abcDisplay = document.getElementById('abc-display');
LETTERS.forEach(function(item, i) {
  var card = document.createElement('button');
  card.className = 'letter-card';
  card.style.background = 'linear-gradient(135deg,' + ABC_COLORS[i%ABC_COLORS.length] + ',' + ABC_COLORS[(i+2)%ABC_COLORS.length] + ')';
  card.innerHTML = item.l + '<span>' + item.l.toLowerCase() + '</span>';
  card.setAttribute('aria-label', 'Letter ' + item.l + ' for ' + item.word);
  card.addEventListener('click', function() {
    abcDisplay.innerHTML = '<div class="big-letter">' + item.l + '<span style="font-size:.5em;color:#9B59B6"> ' + item.l.toLowerCase() + '</span></div>'
      + '<div class="letter-word">' + item.l + ' is for <strong>' + item.word + '</strong></div>'
      + '<div class="letter-emoji">' + item.emoji + '</div>';
    speak(item.l + '. ' + item.l + ' is for ' + item.word + '!');
    addStar(1);
  });
  abcGrid.appendChild(card);
});

/* ===== COUNT ===== */
var countNum = 5;
var countDisplay = document.getElementById('count-num');
var dotArea = document.getElementById('dot-area');
var DOT_COLORS = ['#3498DB','#E74C3C','#2ECC71','#F1C40F','#9B59B6','#FF6B9D','#1ABC9C','#E67E22'];
function renderDots(n) {
  dotArea.innerHTML = '';
  for (var i = 0; i < n; i++) {
    var d = document.createElement('div');
    d.className = 'dot';
    d.style.background = DOT_COLORS[i % DOT_COLORS.length];
    d.style.animationDelay = (i * 0.04) + 's';
    dotArea.appendChild(d);
  }
  countDisplay.textContent = n;
  speak(String(n));
}
document.getElementById('plus-btn').addEventListener('click', function() {
  if (countNum < 20) { countNum++; renderDots(countNum); addStar(1); }
});
document.getElementById('minus-btn').addEventListener('click', function() {
  if (countNum > 0) { countNum--; renderDots(countNum); }
});
renderDots(countNum);

/* ===== MATH ===== */
var MATH_EMOJIS = ['🍎','🍊','🍋','🍇','🍓','⭐','🌟','��','🦋','🌸'];
var mathAnswered = false;
function newMathQ() {
  mathAnswered = false;
  document.getElementById('math-next-btn').style.display = 'none';
  document.getElementById('math-feedback').textContent = '';
  document.querySelectorAll('.choice-btn').forEach(function(b){ b.classList.remove('correct','wrong'); b.disabled = false; });
  var tier = Math.random(), a, b, op, ans;
  if (tier < 0.4) {
    a = Math.floor(Math.random()*6); b = Math.floor(Math.random()*(6-a)); op='+'; ans=a+b;
  } else if (tier < 0.75) {
    a = Math.floor(Math.random()*11); b = Math.floor(Math.random()*(11-a)); op='+'; ans=a+b;
  } else {
    ans = Math.floor(Math.random()*11); b = Math.floor(Math.random()*(ans+1)); a=ans+b; op='−';
  }
  var e = MATH_EMOJIS[Math.floor(Math.random()*MATH_EMOJIS.length)];
  document.getElementById('math-emoji-row').textContent = e.repeat(Math.min(a,10));
  document.getElementById('math-problem').textContent = a + ' ' + op + ' ' + b + ' = ?';
  speak('What is ' + a + ' ' + (op==='−'?'minus':'plus') + ' ' + b + '?');
  var wrong = [];
  var tried = 0;
  while (wrong.length < 3 && tried < 40) {
    tried++;
    var d = ans + (Math.floor(Math.random()*5)-2);
    if (d !== ans && d >= 0 && d <= 20 && wrong.indexOf(d) === -1) wrong.push(d);
  }
  var choices = shuffle([ans].concat(wrong));
  var container = document.getElementById('math-choices');
  container.innerHTML = '';
  choices.forEach(function(c) {
    var btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c;
    btn.setAttribute('aria-label', 'Answer ' + c);
    btn.addEventListener('click', function(){ checkMath(btn, c, ans); });
    container.appendChild(btn);
  });
}
function checkMath(btn, chosen, ans) {
  if (mathAnswered) return;
  mathAnswered = true;
  document.querySelectorAll('.choice-btn').forEach(function(b){ b.disabled = true; });
  if (chosen === ans) {
    btn.classList.add('correct');
    document.getElementById('math-feedback').textContent = '🎉 Correct! Great job!';
    speak('Correct! Great job!');
    addStar(2);
  } else {
    btn.classList.add('wrong');
    document.getElementById('math-feedback').textContent = 'Try again! The answer was ' + ans + ' 😊';
    speak('The answer was ' + ans + '. Keep trying!');
    document.querySelectorAll('.choice-btn').forEach(function(b){
      if (parseInt(b.textContent) === ans) b.classList.add('correct');
    });
  }
  document.getElementById('math-next-btn').style.display = 'inline-block';
}
document.getElementById('math-next-btn').addEventListener('click', newMathQ);
newMathQ();

/* ===== SHAPES ===== */
var SHAPES = [
  {name:'Circle',    sides:'No corners!',              color:'#E74C3C', svg:'<circle cx="40" cy="40" r="35" fill="#E74C3C"/>'},
  {name:'Square',    sides:'4 equal sides',            color:'#3498DB', svg:'<rect x="8" y="8" width="64" height="64" rx="4" fill="#3498DB"/>'},
  {name:'Triangle',  sides:'3 sides',                  color:'#2ECC71', svg:'<polygon points="40,5 75,72 5,72" fill="#2ECC71"/>'},
  {name:'Rectangle', sides:'4 sides',                  color:'#9B59B6', svg:'<rect x="4" y="18" width="72" height="44" rx="4" fill="#9B59B6"/>'},
  {name:'Diamond',   sides:'4 sides',                  color:'#F1C40F', svg:'<polygon points="40,4 76,40 40,76 4,40" fill="#F1C40F"/>'},
  {name:'Star',      sides:'5 points',                 color:'#FF6B9D', svg:'<polygon points="40,4 49,30 76,30 54,47 62,74 40,57 18,74 26,47 4,30 31,30" fill="#FF6B9D"/>'},
  {name:'Pentagon',  sides:'5 sides',                  color:'#E67E22', svg:'<polygon points="40,4 76,30 62,72 18,72 4,30" fill="#E67E22"/>'},
  {name:'Hexagon',   sides:'6 sides',                  color:'#1ABC9C', svg:'<polygon points="40,4 74,22 74,58 40,76 6,58 6,22" fill="#1ABC9C"/>'},
  {name:'Oval',      sides:'Like a stretched circle',  color:'#FF8E53', svg:'<ellipse cx="40" cy="40" rx="38" ry="24" fill="#FF8E53"/>'},
  {name:'Heart',     sides:'A love shape!',            color:'#E74C3C', svg:'<path d="M40 68 C40 68 8 48 8 28 C8 16 18 8 28 12 C34 14 40 20 40 20 C40 20 46 14 52 12 C62 8 72 16 72 28 C72 48 40 68 40 68Z" fill="#E74C3C"/>'},
];
var shapesGrid = document.getElementById('shapes-grid');
SHAPES.forEach(function(s) {
  var card = document.createElement('div');
  card.className = 'shape-card';
  card.setAttribute('tabindex','0');
  card.setAttribute('role','button');
  card.setAttribute('aria-label', s.name);
  card.innerHTML = '<svg class="shape-svg" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">' + s.svg + '</svg>'
    + '<div class="shape-name">' + s.name + '</div>'
    + '<div class="shape-sides">' + s.sides + '</div>';
  function onClick() {
    document.getElementById('shape-feedback').textContent = '✨ This is a ' + s.name + '! ' + s.sides;
    speak('This is a ' + s.name + '. ' + s.sides);
    addStar(1);
  }
  card.addEventListener('click', onClick);
  card.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' ') onClick(); });
  shapesGrid.appendChild(card);
});

/* ===== WORDS ===== */
var SIGHT_WORDS = [
  {word:'the',  sentence:'I see THE cat.'},
  {word:'and',  sentence:'I like cats AND dogs.'},
  {word:'a',    sentence:'I have A book.'},
  {word:'to',   sentence:"Let's go TO school."},
  {word:'said', sentence:'She SAID hello.'},
  {word:'in',   sentence:'The ball is IN the box.'},

var wordsAnswered = false;
var currentWordIdx = 0;
var wordsList = shuffle(SIGHT_WORDS.slice());
function newWord() {
  wordsAnswered = false;
  document.getElementById('words-next-btn').style.display = 'none';
  document.getElementById('words-feedback').textContent = '';
  document.querySelectorAll('.word-choice').forEach(function(b){ b.classList.remove('correct','wrong'); b.disabled=false; });
  var item = wordsList[currentWordIdx % wordsList.length];
  currentWordIdx++;
  document.getElementById('sight-word').textContent = item.word.toUpperCase();
  document.getElementById('word-hint').textContent = item.sentence;
  speak('Can you find the word: ' + item.word + '?');
  var others = SIGHT_WORDS.filter(function(x){ return x.word !== item.word; }).map(function(x){ return x.word; });
  var wrong3 = shuffle(others).slice(0,3);
  var choices = shuffle([item.word].concat(wrong3));
  var container = document.getElementById('word-choices');
  container.innerHTML = '';
  choices.forEach(function(w) {
    var btn = document.createElement('button');
    btn.className = 'word-choice';
    btn.textContent = w;
    btn.setAttribute('aria-label', w);
    (function(w){ btn.addEventListener('click', function(){ checkWord(btn, w, item.word); }); })(w);
    container.appendChild(btn);
  });
}
function checkWord(btn, chosen, correct) {
  if (wordsAnswered) return;
  wordsAnswered = true;
  document.querySelectorAll('.word-choice').forEach(function(b){ b.disabled=true; });
  if (chosen === correct) {
    btn.classList.add('correct');
    document.getElementById('words-feedback').textContent = "🎊 That's right! Awesome reader!";
    speak("That's right! Awesome reader!");
    addStar(2);
  } else {
    btn.classList.add('wrong');
    document.getElementById('words-feedback').textContent = 'Oops! The word was "' + correct.toUpperCase() + '" 😊';
    speak('The word was ' + correct + '. Keep reading!');
    document.querySelectorAll('.word-choice').forEach(function(b){
      if (b.textContent === correct) b.classList.add('correct');
    });
  }
  document.getElementById('words-next-btn').style.display = 'inline-block';
}
document.getElementById('words-next-btn').addEventListener('click', newWord);
newWord();

/* ===== CONFETTI ===== */
var canvas = document.getElementById('confetti-canvas');
var ctx = canvas.getContext('2d');
var particles = [];
var animId = null;
var CONF_COLORS = ['#FF6B9D','#F1C40F','#3498DB','#2ECC71','#9B59B6','#E67E22','#1ABC9C'];
function launchConfetti() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  for (var i = 0; i < 140; i++) {
    particles.push({
      x: Math.random()*canvas.width, y: -10-Math.random()*100,
      w: 8+Math.random()*10, h: 6+Math.random()*8,
      color: CONF_COLORS[Math.floor(Math.random()*CONF_COLORS.length)],
      vx: (Math.random()-.5)*4, vy: 2+Math.random()*3,
      rot: Math.random()*360, rotV: (Math.random()-.5)*8, alpha: 1
    });
  }
  if (!animId) animateConfetti();
}
function animateConfetti() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles = particles.filter(function(p){ return p.alpha > 0.05; });
  particles.forEach(function(p) {
    p.x+=p.vx; p.y+=p.vy; p.rot+=p.rotV;
    if (p.y > canvas.height) p.alpha -= 0.06;
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.translate(p.x+p.w/2, p.y+p.h/2);
    ctx.rotate(p.rot*Math.PI/180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  });
  if (particles.length > 0) { animId = requestAnimationFrame(animateConfetti); }
  else { animId = null; ctx.clearRect(0,0,canvas.width,canvas.height); }
}
window.addEventListener('resize', function(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; });
window.addEventListener('load', function(){ speak('Welcome to Kiddie Genius! Lets learn and have fun!'); });
