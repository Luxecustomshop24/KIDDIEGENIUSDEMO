<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#60c8f8"/>
      <stop offset="100%" stop-color="#a8e4fc"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5fcc3a"/>
      <stop offset="100%" stop-color="#3a9a20"/>
    </linearGradient>
    <!-- Rainbow arcs -->
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e63329"/>
      <stop offset="20%"  stop-color="#fd7c1e"/>
      <stop offset="40%"  stop-color="#ffc107"/>
      <stop offset="60%"  stop-color="#4caf28"/>
      <stop offset="80%"  stop-color="#2b7de9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="text-shadow">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="rgba(22,43,110,.5)"/>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="1400" height="520" fill="url(#sky)"/>

  <!-- Rainbow (large arc behind everything) -->
  <path d="M100,480 Q700,-60 1300,480" stroke="url(#rainbow)" stroke-width="44" fill="none" opacity=".85"/>
  <path d="M100,480 Q700,-60 1300,480" stroke="white" stroke-width="8"  fill="none" opacity=".3"/>

  <!-- Clouds -->
  <g fill="white" opacity=".9">
    <ellipse cx="180" cy="80"  rx="70" ry="40"/>
    <ellipse cx="130" cy="90"  rx="50" ry="35"/>
    <ellipse cx="230" cy="90"  rx="55" ry="32"/>
    <ellipse cx="1100" cy="70"  rx="80" ry="45"/>
    <ellipse cx="1050" cy="82"  rx="55" ry="35"/>
    <ellipse cx="1155" cy="82"  rx="60" ry="32"/>
    <ellipse cx="650"  cy="55"  rx="55" ry="32"/>
    <ellipse cx="600"  cy="64"  rx="40" ry="26"/>
    <ellipse cx="700"  cy="64"  rx="45" ry="26"/>
  </g>

  <!-- Stars -->
  <g fill="#ffe040" opacity=".9">
    <polygon points="320,95 325,110 340,110 328,119 333,134 320,125 307,134 312,119 300,110 315,110" transform="scale(.8) translate(80,30)"/>
    <polygon points="1050,115 1054,127 1066,127 1056,135 1060,147 1050,139 1040,147 1044,135 1034,127 1046,127" transform="scale(.7) translate(450,20)"/>
    <polygon points="200,190 203,200 213,200 205,206 208,216 200,210 192,216 195,206 187,200 197,200" transform="scale(.6) translate(900,-80)"/>
  </g>

  <!-- Rocket (top-left area) -->
  <g transform="translate(290,80) rotate(-35)" opacity=".95">
    <ellipse cx="0" cy="0" rx="18" ry="34" fill="#e63329"/>
    <path d="M-10,30 Q0,50 10,30Z" fill="#ffc107"/>
    <path d="M-18,10 Q-35,20 -25,32 Q-15,28 -10,20Z" fill="#e63329" opacity=".8"/>
    <path d="M18,10 Q35,20 25,32 Q15,28 10,20Z" fill="#e63329" opacity=".8"/>
    <ellipse cx="0" cy="2" rx="8" ry="10" fill="#a8e4fc" opacity=".9"/>
    <!-- Flame -->
    <path d="M-8,34 Q0,60 8,34 Q4,44 0,42 Q-4,44 -8,34Z" fill="#fd7c1e" opacity=".9"/>
  </g>

  <!-- Grass strip at bottom -->
  <rect y="420" width="1400" height="100" fill="url(#grass)"/>
  <!-- Grass texture bumps -->
  <path d="M0,420 Q50,400 100,420 Q150,400 200,420 Q250,400 300,420 Q350,400 400,420 Q450,400 500,420 Q550,400 600,420 Q650,400 700,420 Q750,400 800,420 Q850,400 900,420 Q950,400 1000,420 Q1050,400 1100,420 Q1150,400 1200,420 Q1250,400 1300,420 Q1350,400 1400,420 L1400,520 L0,520Z" fill="#4caf28"/>

  <!-- Flowers in grass -->
  <g opacity=".9">
    <circle cx="80"  cy="430" r="6" fill="white"/>
    <circle cx="80"  cy="430" r="4" fill="#ffc107"/>
    <circle cx="400" cy="428" r="5" fill="#fd79a8"/>
    <circle cx="400" cy="428" r="3" fill="#ffe040"/>
    <circle cx="750" cy="432" r="6" fill="white"/>
    <circle cx="750" cy="432" r="4" fill="#ffc107"/>
    <circle cx="1100" cy="428" r="5" fill="#fd79a8"/>
    <circle cx="1100" cy="428" r="3" fill="#ffe040"/>
    <circle cx="1300" cy="430" r="6" fill="white"/>
    <circle cx="1300" cy="430" r="4" fill="#ffc107"/>
  </g>

  <!-- Castle (right side) -->
  <g fill="#d4a060" opacity=".9">
    <rect x="1100" y="250" width="220" height="180"/>
    <!-- Towers -->
    <rect x="1090" y="200" width="60" height="100"/>
    <rect x="1260" y="200" width="60" height="100"/>
    <!-- Battlements main -->
    <rect x="1110" y="240" width="20" height="20"/><rect x="1140" y="240" width="20" height="20"/>
    <rect x="1170" y="240" width="20" height="20"/><rect x="1200" y="240" width="20" height="20"/>
    <rect x="1230" y="240" width="20" height="20"/>
    <!-- Tower tops -->
    <polygon points="1090,200 1150,200 1120,160" fill="#c05050"/>
    <polygon points="1260,200 1320,200 1290,160" fill="#c05050"/>
    <!-- Door -->
    <path d="M1180,430 L1180,360 Q1210,330 1240,360 L1240,430Z" fill="#8a5a20"/>
    <!-- Windows -->
    <rect x="1115" y="290" width="30" height="35" rx="15" fill="#a8e4fc"/>
    <rect x="1275" y="290" width="30" height="35" rx="15" fill="#a8e4fc"/>
    <!-- Flags -->
    <line x1="1120" y1="160" x2="1120" y2="110" stroke="#8a5a20" stroke-width="4"/>
    <polygon points="1120,110 1160,125 1120,140" fill="#e63329"/>
    <line x1="1290" y1="160" x2="1290" y2="110" stroke="#8a5a20" stroke-width="4"/>
    <polygon points="1290,110 1330,125 1290,140" fill="#e63329"/>
  </g>

  <!-- Path leading to castle -->
  <path d="M900,520 Q1000,460 1100,430 Q1200,415 1320,430" stroke="#d4a060" stroke-width="35" fill="none" opacity=".5" stroke-linecap="round"/>

  <!-- Trees (left area) -->
  <g>
    <rect x="83" y="360" width="12" height="80" fill="#8a5a20"/><!-- tree trunk -->
    <circle cx="89" cy="340" r="40" fill="#3a8a1f"/>
    <circle cx="70" cy="355" r="28" fill="#4caf28"/>
    <circle cx="108" cy="352" r="32" fill="#4caf28"/>
  </g>

  <!-- Lightbulb character (idea) -->
  <g transform="translate(1010,115)">
    <ellipse cx="0" cy="0" rx="32" ry="36" fill="#ffe040"/>
    <rect x="-14" y="28" width="28" height="8" rx="4" fill="#c8a000"/>
    <rect x="-12" y="36" width="24" height="8" rx="4" fill="#c8a000"/>
    <!-- Eyes -->
    <circle cx="-10" cy="-5" r="7" fill="white"/>
    <circle cx="10"  cy="-5" r="7" fill="white"/>
    <circle cx="-10" cy="-5" r="4" fill="#162b6e"/>
    <circle cx="10"  cy="-5" r="4" fill="#162b6e"/>
    <!-- Glasses -->
    <path d="M-18,-5 Q-18,-13 -10,-13 Q-2,-13 -2,-5 Q-2,3 -10,3 Q-18,3 -18,-5Z" stroke="#3a2400" stroke-width="2" fill="none"/>
    <path d="M2,-5 Q2,-13 10,-13 Q18,-13 18,-5 Q18,3 10,3 Q2,3 2,-5Z" stroke="#3a2400" stroke-width="2" fill="none"/>
    <line x1="-2" y1="-5" x2="2" y2="-5" stroke="#3a2400" stroke-width="2"/>
    <!-- Smile -->
    <path d="M-8,10 Q0,18 8,10" stroke="#3a2400" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Glow rays -->
    <line x1="-38" y1="-15" x2="-52" y2="-22" stroke="#ffe040" stroke-width="3" opacity=".8"/>
    <line x1="-40" y1="5"   x2="-56" y2="8"   stroke="#ffe040" stroke-width="3" opacity=".8"/>
    <line x1="38"  y1="-15" x2="52"  y2="-22" stroke="#ffe040" stroke-width="3" opacity=".8"/>
    <line x1="40"  y1="5"   x2="56"  y2="8"   stroke="#ffe040" stroke-width="3" opacity=".8"/>
    <line x1="0"   y1="-40" x2="0"   y2="-56" stroke="#ffe040" stroke-width="3" opacity=".8"/>
  </g>

  <!-- ===== BRAND TEXT CENTER ===== -->
  <g filter="url(#text-shadow)">
    <!-- "Kiddie" -->
    <text x="700" y="210" text-anchor="middle"
          font-family="Nunito,Arial Black,sans-serif" font-weight="900" font-size="120"
          fill="#e63329" stroke="white" stroke-width="6" paint-order="stroke">Kiddie</text>
    <!-- "GENiUS" — multi-color -->
    <text x="700" y="340" text-anchor="middle"
          font-family="Nunito,Arial Black,sans-serif" font-weight="900" font-size="140">
      <tspan fill="#ffc107" stroke="white" stroke-width="6" paint-order="stroke">G</tspan><tspan fill="#4caf28" stroke="white" stroke-width="6" paint-order="stroke">E</tspan><tspan fill="#2b7de9" stroke="white" stroke-width="6" paint-order="stroke">N</tspan><tspan fill="#ffc107" stroke="white" stroke-width="6" paint-order="stroke">i</tspan><tspan fill="#e63329" stroke="white" stroke-width="6" paint-order="stroke">U</tspan><tspan fill="#4caf28" stroke="white" stroke-width="6" paint-order="stroke">S</tspan>
    </text>
    <!-- "World" banner -->
    <rect x="440" y="360" width="520" height="72" rx="36" fill="#2b7de9"/>
    <text x="700" y="412" text-anchor="middle"
          font-family="Nunito,Arial Black,sans-serif" font-weight="900" font-size="54"
          fill="white">World</text>
  </g>

  <!-- Tagline beneath brand -->
  <rect x="490" y="440" width="420" height="46" rx="23" fill="rgba(255,255,255,.85)"/>
  <text x="700" y="471" text-anchor="middle"
        font-family="Nunito,Arial,sans-serif" font-weight="800" font-size="26"
        fill="#162b6e">Learn. Play. Grow.</text>

  <!-- Music notes -->
  <g fill="#2b7de9" opacity=".8">
    <text x="60" y="240" font-size="48" font-family="serif">♪</text>
    <text x="90" y="280" font-size="32" font-family="serif">♫</text>
  </g>

  <!-- ABC blocks (bottom left) -->
  <g transform="translate(60,370)">
    <rect width="50" height="50" rx="8" fill="#e63329"/>
    <text x="25" y="35" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-weight="900" font-size="28" fill="white">1</text>
    <rect x="54" width="50" height="50" rx="8" fill="#2b7de9"/>
    <text x="79" y="35" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-weight="900" font-size="28" fill="white">2</text>
    <rect x="108" width="50" height="50" rx="8" fill="#4caf28"/>
    <text x="133" y="35" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-weight="900" font-size="28" fill="white">3</text>
  </g>

  <!-- Paint palette -->
  <g transform="translate(1320,360)" opacity=".9">
    <ellipse cx="30" cy="30" rx="38" ry="32" fill="#f5e8c0"/>
    <circle cx="15" cy="15" r="7" fill="#e63329"/>
    <circle cx="34" cy="10" r="7" fill="#ffc107"/>
    <circle cx="50" cy="18" r="7" fill="#4caf28"/>
    <circle cx="55" cy="36" r="7" fill="#2b7de9"/>
    <circle cx="42" cy="50" r="7" fill="#8b5cf6"/>
  </g>
</svg>
