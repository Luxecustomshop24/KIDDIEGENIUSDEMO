<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420">
  <defs>
    <radialGradient id="fur" cx="45%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#f0a830"/>
      <stop offset="100%" stop-color="#d4841a"/>
    </radialGradient>
    <radialGradient id="belly" cx="50%" cy="40%" r="55%">
      <stop offset="0%"   stop-color="#f5d9a0"/>
      <stop offset="100%" stop-color="#e8c070"/>
    </radialGradient>
    <radialGradient id="cap-grad" cx="40%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#4fb8f0"/>
      <stop offset="100%" stop-color="#1a6bc8"/>
    </radialGradient>
    <radialGradient id="eye-l" cx="35%" cy="30%" r="60%">
      <stop offset="0%"   stop-color="#60c0f0"/>
      <stop offset="100%" stop-color="#1a8ad4"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="8" stdDeviation="8" flood-color="rgba(22,43,110,.25)"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">

    <!-- ===== BODY ===== -->
    <ellipse cx="160" cy="300" rx="80" ry="95" fill="url(#fur)"/>
    <!-- Belly patch -->
    <ellipse cx="160" cy="310" rx="48" ry="65" fill="url(#belly)"/>

    <!-- Body spots -->
    <ellipse cx="120" cy="260" rx="9" ry="7" fill="#3a2400" opacity=".6" transform="rotate(-15,120,260)"/>
    <ellipse cx="195" cy="255" rx="8" ry="6" fill="#3a2400" opacity=".6" transform="rotate(20,195,255)"/>
    <ellipse cx="108" cy="300" rx="7" ry="6" fill="#3a2400" opacity=".55"/>
    <ellipse cx="210" cy="295" rx="8" ry="6" fill="#3a2400" opacity=".55"/>
    <ellipse cx="125" cy="340" rx="7" ry="5" fill="#3a2400" opacity=".5"/>
    <ellipse cx="195" cy="338" rx="7" ry="5" fill="#3a2400" opacity=".5"/>

    <!-- ===== ARMS (raised right paw) ===== -->
    <!-- Left arm (our right — down) -->
    <ellipse cx="96" cy="340" rx="22" ry="38" fill="url(#fur)" transform="rotate(-12,96,340)"/>
    <!-- Right arm (our left — raised) -->
    <path d="M228,250 Q270,210 265,175 Q255,155 240,165 Q250,185 235,220 Q225,240 218,265Z" fill="url(#fur)"/>

    <!-- Raised paw / hand -->
    <circle cx="258" cy="162" r="24" fill="url(#fur)"/>
    <!-- Paw fingers -->
    <ellipse cx="243" cy="142" rx="8" ry="11" fill="url(#fur)" transform="rotate(-20,243,142)"/>
    <ellipse cx="258" cy="136" rx="8" ry="12" fill="url(#fur)"/>
    <ellipse cx="274" cy="140" rx="8" ry="11" fill="url(#fur)" transform="rotate(20,274,140)"/>

    <!-- ===== TAIL ===== -->
    <path d="M230,380 Q280,360 295,330 Q305,305 290,285 Q275,270 262,280 Q272,295 265,315 Q255,340 215,358Z"
          fill="url(#fur)"/>
    <!-- Tail stripes -->
    <path d="M268,284 Q280,294 275,308" stroke="#3a2400" stroke-width="5" fill="none" opacity=".55" stroke-linecap="round"/>
    <path d="M258,305 Q270,316 265,330" stroke="#3a2400" stroke-width="5" fill="none" opacity=".5" stroke-linecap="round"/>
    <path d="M248,328 Q260,340 252,352" stroke="#3a2400" stroke-width="5" fill="none" opacity=".45" stroke-linecap="round"/>

    <!-- ===== LEGS / FEET ===== -->
    <ellipse cx="130" cy="385" rx="30" ry="20" fill="url(#fur)"/>
    <ellipse cx="188" cy="385" rx="30" ry="20" fill="url(#fur)"/>
    <!-- Paw toes -->
    <ellipse cx="112" cy="393" rx="9" ry="7" fill="url(#belly)"/>
    <ellipse cx="130" cy="397" rx="9" ry="7" fill="url(#belly)"/>
    <ellipse cx="148" cy="393" rx="9" ry="7" fill="url(#belly)"/>
    <ellipse cx="170" cy="393" rx="9" ry="7" fill="url(#belly)"/>
    <ellipse cx="188" cy="397" rx="9" ry="7" fill="url(#belly)"/>
    <ellipse cx="206" cy="393" rx="9" ry="7" fill="url(#belly)"/>

    <!-- ===== HEAD ===== -->
    <ellipse cx="160" cy="195" rx="75" ry="70" fill="url(#fur)"/>
    <!-- Muzzle -->
    <ellipse cx="160" cy="218" rx="40" ry="32" fill="url(#belly)"/>

    <!-- Ears -->
    <path d="M95,148 Q80,105 110,115 Q120,130 115,152Z" fill="url(#fur)"/>
    <path d="M100,148 Q90,118 108,122 Q116,132 113,150Z" fill="#e07020" opacity=".5"/>
    <path d="M225,148 Q240,105 210,115 Q200,130 205,152Z" fill="url(#fur)"/>
    <path d="M220,148 Q230,118 212,122 Q204,132 207,150Z" fill="#e07020" opacity=".5"/>

    <!-- Head spots -->
    <ellipse cx="115" cy="185" rx="7" ry="5" fill="#3a2400" opacity=".5" transform="rotate(-10,115,185)"/>
    <ellipse cx="205" cy="182" rx="7" ry="5" fill="#3a2400" opacity=".5" transform="rotate(10,205,182)"/>
    <ellipse cx="140" cy="172" rx="5" ry="4" fill="#3a2400" opacity=".4"/>
    <ellipse cx="180" cy="170" rx="5" ry="4" fill="#3a2400" opacity=".4"/>

    <!-- Tear stripes (cheetah feature) -->
    <path d="M125,205 Q118,218 120,232" stroke="#3a2400" stroke-width="2.5" fill="none" opacity=".6" stroke-linecap="round"/>
    <path d="M195,205 Q202,218 200,232" stroke="#3a2400" stroke-width="2.5" fill="none" opacity=".6" stroke-linecap="round"/>

    <!-- ===== EYES ===== -->
    <!-- Left eye -->
    <ellipse cx="133" cy="198" rx="17" ry="16" fill="white"/>
    <circle  cx="133" cy="198" r="12"  fill="url(#eye-l)"/>
    <circle  cx="133" cy="198" r="7"   fill="#1a1a2e"/>
    <circle  cx="129" cy="194" r="3"   fill="white" opacity=".8"/>
    <!-- Right eye -->
    <ellipse cx="187" cy="198" rx="17" ry="16" fill="white"/>
    <circle  cx="187" cy="198" r="12"  fill="url(#eye-l)"/>
    <circle  cx="187" cy="198" r="7"   fill="#1a1a2e"/>
    <circle  cx="183" cy="194" r="3"   fill="white" opacity=".8"/>

    <!-- Nose -->
    <ellipse cx="160" cy="222" rx="9" ry="7" fill="#c05a20"/>
    <!-- Nostrils -->
    <ellipse cx="155" cy="224" rx="3" ry="2" fill="#8a3a10" opacity=".7"/>
    <ellipse cx="165" cy="224" rx="3" ry="2" fill="#8a3a10" opacity=".7"/>
    <!-- Mouth -->
    <path d="M151,232 Q160,242 169,232" stroke="#8a3a10" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M160,232 L160,238" stroke="#8a3a10" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Whiskers -->
    <line x1="120" y1="228" x2="148" y2="232" stroke="#c8a060" stroke-width="1.5" opacity=".7"/>
    <line x1="118" y1="236" x2="148" y2="236" stroke="#c8a060" stroke-width="1.5" opacity=".7"/>
    <line x1="172" y1="232" x2="200" y2="228" stroke="#c8a060" stroke-width="1.5" opacity=".7"/>
    <line x1="172" y1="236" x2="202" y2="236" stroke="#c8a060" stroke-width="1.5" opacity=".7"/>

    <!-- ===== BASEBALL CAP ===== -->
    <!-- Cap body -->
    <path d="M88,170 Q100,108 160,105 Q220,108 232,170 Q196,145 160,143 Q124,145 88,170Z"
          fill="url(#cap-grad)"/>
    <!-- Cap top dome -->
    <path d="M90,170 Q95,130 160,125 Q225,130 230,170 Q195,148 160,146 Q125,148 90,170Z"
          fill="#1a6bc8"/>
    <path d="M95,165 Q100,135 160,130 Q220,135 225,165" stroke="#0d4a9a" stroke-width="2" fill="none" opacity=".5"/>
    <!-- Cap brim -->
    <path d="M88,168 Q70,175 62,168 Q65,158 88,162Z" fill="#1a6bc8"/>
    <!-- Globe icon on cap -->
    <circle cx="160" cy="145" r="16" fill="#1a6bc8" stroke="white" stroke-width="1.5"/>
    <ellipse cx="160" cy="145" rx="16" ry="10" fill="none" stroke="white" stroke-width="1" opacity=".6"/>
    <line x1="144" y1="145" x2="176" y2="145" stroke="white" stroke-width="1" opacity=".6"/>
    <!-- Cap button on top -->
    <circle cx="160" cy="120" r="5" fill="white" opacity=".7"/>
    <!-- "Kiddie Genius" text on cap -->
    <text x="160" y="143" text-anchor="middle" font-family="Nunito,Arial,sans-serif"
          font-weight="900" font-size="7" fill="white" opacity=".9">Kiddie</text>
    <text x="160" y="152" text-anchor="middle" font-family="Nunito,Arial,sans-serif"
          font-weight="900" font-size="7" fill="white" opacity=".9">Genius</text>
  </g>
</svg>
